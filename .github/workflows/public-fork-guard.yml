name: public-fork-guard
# This fork is public. Deployment values (organization names, AWS account IDs,
# private endpoint IDs) belong in deployment config, never in the tree, commit
# messages or pull request text. Commit messages and pull request text may link
# an issue or pull request by its repository reference; nothing else is exempt.
# Each pattern is written so it does not match itself, so this file needs no
# exclusion.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Public fork guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan tree, commit messages and pull request text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          patterns=(
            -e 'kuberno[g]rc'
            -e 'vpce-[0-9a-z]'
            -e 'arn:aws[a-z-]*:[a-z0-9-]*:[a-z0-9-]*:[0-9]{12}'
            -e '[0-9]{12}\.dkr\.ecr'
            -e '(account[_-]?id|aws[_-]?account)["'"'"' ]*[:=]+ *["'"'"']?[0-9]{12}([^0-9]|$)'
          )
          # Drops owner/repo#N and github.com/owner/repo/(issues|pull)/N links.
          strip_links() {
            sed -E 's#(https://)?(github\.com/)?kuberno[g]rc/[A-Za-z0-9._-]+(\#|/issues/|/pull/)[0-9]+##Ig'
          }
          found=0
          if git grep -nIiE "${patterns[@]}"; then
            echo "::error::Deployment-specific values are tracked in the tree"
            found=1
          fi
          # A push whose previous head is unknown (first push, force-push) scans its head.
          if [ -n "${BASE_SHA//0/}" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range=("$BASE_SHA..$HEAD_SHA")
          else
            range=(-1 "$HEAD_SHA")
          fi
          if git log --format='%H %B' "${range[@]}" | strip_links | grep -niE "${patterns[@]}"; then
            echo "::error::A commit message carries deployment-specific values"
            found=1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | strip_links | grep -niE "${patterns[@]}"; then
              echo "::error::The pull request title or body carries deployment-specific values"
              found=1
            fi
          fi
          exit "$found"
